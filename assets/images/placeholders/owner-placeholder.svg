  <circle cx="400" cy="450" r="290" fill="none" stroke="#a86f62" stroke-width="4" stroke-dasharray="14 14" opacity=".55"/>
  <text x="400" y="815" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7b4f45">OWNER PHOTO</text>
