  <desc id="desc">Pastel pink placeholder ready to be replaced with the bakery owner's portrait.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdecef"/>
      <stop offset="1" stop-color="#efcfd4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="400" cy="320" r="120" fill="#c89784" opacity=".35"/>
